<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b14" />
    <title>Pulse Messenger — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050b14;
        color: #f4f4f6;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 320px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; opacity: 0.7; margin: 0 0 16px; }
      button {
        background: #fff;
        color: #0d0c11;
        border: 0;
        border-radius: 999px;
        padding: 10px 22px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Pulse Messenger needs a connection to load new chats. Your messages will send when you're back.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
